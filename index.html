<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Robot Eyes</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
  body {
    font-family: system-ui, sans-serif;
    touch-action:none;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    --theme-hue: 0deg;
  }
  #stage {
    position:relative; width:100vw; height:100dvh; overflow:hidden;
    background:#000;
    isolation:isolate;
  }
  #stars {
    position:absolute; inset:0; opacity:.18;
    background-image:radial-gradient(circle at 20% 20%, #fff 0 1px, transparent 1.5px),
                     radial-gradient(circle at 70% 35%, #fff 0 1px, transparent 1.5px),
                     radial-gradient(circle at 40% 75%, #fff 0 1px, transparent 1.5px),
                     radial-gradient(circle at 88% 80%, #fff 0 1px, transparent 1.5px);
    background-size:130px 170px, 190px 210px, 160px 190px, 220px 180px;
    animation: drift 18s linear infinite;
  }
  @keyframes drift { to { transform:translate3d(-30px,20px,0); } }

  #face {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    gap:clamp(18px, 6vw, 65px);
    transition:transform .18s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
    filter:hue-rotate(var(--theme-hue));
  }
  #mouth, #love-particles, #sleep-particles, #dizzy-stars, #mood-effects {
    filter:hue-rotate(var(--theme-hue));
  }
  #settings-toggle {
    position:absolute; z-index:12; right:max(12px, env(safe-area-inset-right));
    top:max(12px, env(safe-area-inset-top));
    border:1px solid rgba(130,240,255,.45); border-radius:999px;
    background:rgba(0,18,24,.72); color:#b5f7ff; padding:8px 12px;
    font:600 11px ui-monospace, monospace; letter-spacing:.7px;
  }
  #setup-overlay {
    position:absolute; inset:0; z-index:20; display:none;
    background:radial-gradient(circle at 25% 20%, rgba(36,220,255,.12), transparent 45%), rgba(0,0,0,.84);
    align-items:center; justify-content:center; padding:20px;
  }
  #setup-overlay.show { display:flex; }
  #setup-card {
    width:min(92vw, 460px); border:1px solid rgba(114,236,255,.4);
    border-radius:18px; padding:18px; background:rgba(2,14,20,.92);
    box-shadow:0 14px 55px rgba(0,0,0,.45), inset 0 0 40px rgba(36,220,255,.08);
    backdrop-filter:blur(10px);
  }
  #setup-card h2 { margin:0 0 8px; font-size:20px; letter-spacing:.2px; }
  #setup-card p { margin:0 0 14px; opacity:.78; font-size:13px; }
  .setup-row { display:flex; gap:10px; margin-bottom:10px; align-items:center; }
  .setup-row label { min-width:115px; opacity:.88; font-size:12px; letter-spacing:.4px; }
  .setup-row input, .setup-row select {
    flex:1; border:1px solid rgba(114,236,255,.35); border-radius:10px;
    background:rgba(0,20,28,.8); color:#d9fbff; padding:8px 9px; font-size:13px;
  }
  .setup-row input[type="checkbox"] { flex:0; width:18px; height:18px; }
  #setup-save {
    width:100%; margin-top:8px; border:1px solid rgba(114,236,255,.55); border-radius:12px;
    background:linear-gradient(180deg, rgba(51,233,255,.35), rgba(18,151,170,.35));
    color:#e8fdff; padding:11px 12px; font:700 12px ui-monospace, monospace; letter-spacing:1px;
  }
  #setup-permissions {
    margin-top:8px; padding:9px 10px; border:1px solid rgba(114,236,255,.25); border-radius:10px;
    background:rgba(0,18,24,.45); color:#bfefff; font:600 11px/1.5 ui-monospace, monospace;
    letter-spacing:.4px;
  }
  .quiet #hint { opacity:.08; }
  .dancing .eye { animation:danceEyes .36s ease-in-out infinite alternate; }
  .dancing #mouth { animation:danceMouth .26s ease-in-out infinite alternate; }
  .dancing #mood-effects { display:block; }
  .dancing #mood-effects span { animation:danceSpark 0.6s ease-in-out infinite; }
  .dancing #mood-effects span:nth-child(2) { animation-delay:.16s; }
  .dancing #mood-effects span:nth-child(3) { animation-delay:.32s; }
  #mouth {
    position:absolute; left:50%; top:calc(50% + clamp(92px, 23vw, 190px));
    width:clamp(38px, 9vw, 76px); height:18px; transform:translateX(-50%);
    border-bottom:5px solid rgba(40,227,237,.58); border-radius:0 0 50% 50%;
    filter:drop-shadow(0 0 7px rgba(40,227,237,.65));
    pointer-events:none; transition:all .25s ease; overflow:visible;
  }
  #mouth::before, #mouth::after {
    content:""; position:absolute; display:none;
  }
  .mouth-core {
    position:absolute; left:50%; top:7px; width:72%; height:8px;
    transform:translateX(-50%); border-radius:0 0 999px 999px;
    background:rgba(2,42,52,.92); box-shadow:inset 0 2px 0 rgba(217,255,255,.28);
    opacity:0; transition:opacity .2s ease;
  }
  .happy #mouth {
    width:clamp(58px, 14vw, 124px); height:clamp(34px, 9vw, 72px);
    border:6px solid #28e3ed; border-top:3px solid #28e3ed;
    border-radius:0 0 52% 52%; background:rgba(0,0,0,.3);
  }
  .happy .mouth-core { opacity:1; top:17%; height:62%; width:78%; }
  .happy #mouth::after {
    display:block; left:50%; bottom:8%; width:58%; height:38%; transform:translateX(-50%);
    background:#28e3ed; border-radius:50% 50% 46% 46%; opacity:.75;
  }
  .love #mouth {
    width:clamp(52px, 12vw, 108px); height:30px; border-bottom:9px solid #28e3ed;
    border-radius:0 0 55% 55%;
  }
  .sad #mouth {
    width:clamp(44px, 10vw, 90px); height:30px;
    border-bottom:0; border-top:8px solid #28e3ed; border-radius:52% 52% 0 0;
  }
  .crying #mouth {
    width:clamp(42px, 9.5vw, 82px); height:32px;
    border-bottom:0; border-top:9px solid #28e3ed; border-radius:54% 54% 0 0;
    animation:mouthTremble .45s ease-in-out infinite alternate;
  }
  .excited #mouth {
    width:clamp(34px, 8vw, 66px); height:clamp(34px, 8vw, 66px);
    border:5px solid #28e3ed; border-radius:50%; background:rgba(40,227,237,.2);
  }
  .excited .mouth-core, .surprised .mouth-core, .scared .mouth-core, .alert .mouth-core {
    opacity:1; top:25%; height:58%; width:60%; border-radius:50%;
  }
  .surprised #mouth, .scared #mouth {
    width:clamp(26px, 6vw, 52px); height:clamp(28px, 6.5vw, 56px);
    border:5px solid #28e3ed; border-radius:50%; background:transparent;
  }
  .angry #mouth {
    width:clamp(48px, 11vw, 92px); height:14px;
    border:0; border-bottom:8px solid #28e3ed; border-radius:0 0 60% 60%;
    transform:translateX(-50%) rotate(-7deg);
  }
  .confused #mouth {
    width:clamp(34px, 8vw, 64px); height:10px;
    border:0; border-bottom:6px solid #28e3ed; border-radius:999px;
    transform:translateX(-50%) rotate(10deg);
  }
  .sleepy #mouth {
    width:clamp(28px, 6.5vw, 56px); height:5px;
    border:0; background:rgba(40,227,237,.68); border-radius:999px;
  }
  .dizzy #mouth {
    width:clamp(62px, 15vw, 126px); height:clamp(20px, 5vw, 40px);
    border:0; background:transparent; transform:translateX(-50%);
  }
  .dizzy #mouth::before {
    display:block;
    left:0; top:0; width:100%; height:100%;
    background:center/contain no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 34'><path d='M6 18 C18 5 30 30 42 18 C54 5 66 30 78 18 C90 5 102 30 104 18' fill='none' stroke='%2328e3ed' stroke-width='7' stroke-linecap='round'/></svg>");
    filter:drop-shadow(0 0 6px rgba(40,227,237,.85));
  }
  .alert #mouth {
    width:20px; height:20px; border:5px solid #28e3ed; border-radius:50%; background:transparent;
  }
  .hot .eye { animation:hotWobble .55s ease-in-out infinite alternate; filter:saturate(1.45) brightness(1.25); }
  .cold .eye { animation:coldShiver .16s ease-in-out infinite alternate; filter:hue-rotate(35deg) brightness(1.15); }
  .thinking .eye:first-child { animation:thinkLeft .8s ease both; }
  .thinking .eye:last-child { animation:thinkRight .8s ease both; }
  .thinking .lid.top { transform:translateY(13%) rotate(-5deg); }
  .scared .eye { animation:scaredJolt .35s ease-in-out 3 alternate; }
  .scared .lid.top { transform:translateY(-18%); }
  .scared .lid.bottom { transform:translateY(-8%); }
  .proud .eye { animation:proudLift .75s ease both; filter:brightness(1.25); }
  .proud .lid.top { transform:translateY(12%) rotate(-3deg); }
  .hot #mouth {
    width:clamp(34px, 8vw, 64px); height:24px; border:0;
    border-bottom:8px solid #28e3ed; border-radius:50%; transform:translateX(-50%) rotate(8deg);
  }
  .cold #mouth {
    width:clamp(34px, 8vw, 62px); height:12px;
    border:4px solid #28e3ed; border-top:0; border-radius:0 0 10px 10px;
  }
  .cold #mouth::before {
    display:block; left:16%; top:-1px; width:68%; height:4px;
    background:#28e3ed; box-shadow:0 6px 0 #28e3ed;
  }
  .thinking #mouth {
    width:clamp(30px, 7vw, 56px); height:9px;
    border:0; border-bottom:6px solid #28e3ed; border-radius:999px;
    transform:translateX(-50%) rotate(11deg);
  }
  .proud #mouth {
    width:clamp(50px, 11vw, 94px); height:24px;
    border:0; border-bottom:8px solid #28e3ed; border-radius:0 0 58% 58%;
    transform:translateX(-50%) rotate(-2deg);
  }
  #mood-effects { display:none; position:absolute; left:50%; top:calc(50% - clamp(120px, 30vw, 240px)); width:1px; height:1px; pointer-events:none; }
  #mood-effects span { position:absolute; color:#28e3ed; font:700 clamp(18px, 5vw, 38px)/1 ui-monospace, monospace; filter:drop-shadow(0 0 7px rgba(40,227,237,.8)); }
  .hot #mood-effects, .cold #mood-effects, .thinking #mood-effects { display:block; }
  .hot #mood-effects span { animation:steamRise 1.3s ease-in-out infinite; }
  .hot #mood-effects span:nth-child(1) { left:-55px; }
  .hot #mood-effects span:nth-child(2) { left:42px; animation-delay:.45s; }
  .cold #mood-effects span { animation:snowDrift 1.4s ease-in-out infinite; }
  .cold #mood-effects span:nth-child(1) { left:-65px; animation-delay:.2s; }
  .cold #mood-effects span:nth-child(2) { left:56px; animation-delay:.7s; }
  .thinking #mood-effects { left:calc(50% + clamp(55px, 14vw, 115px)); top:calc(50% - clamp(105px, 26vw, 210px)); }
  .thinking #mood-effects span { animation:thoughtPop 1.1s ease-in-out infinite; }
  .thinking #mood-effects span:nth-child(2) { margin-left:27px; margin-top:-24px; animation-delay:.25s; }
  .thinking #mood-effects span:nth-child(3) { margin-left:51px; margin-top:-46px; animation-delay:.5s; }
  #love-particles, #sleep-particles, #dizzy-stars { display:none; position:absolute; pointer-events:none; }
  #love-particles { left:50%; top:calc(50% - clamp(30px, 8vw, 70px)); width:1px; height:1px; }
  #love-particles span, #sleep-particles span {
    position:absolute; color:#28e3ed; font-weight:700; line-height:1;
    filter:drop-shadow(0 0 7px rgba(40,227,237,.85));
  }
  #love-particles span { font-size:clamp(16px, 4vw, 32px); animation:heartFloat 1.5s ease-out both; }
  #love-particles span:nth-child(1) { animation-delay:0s; --heart-x:-62px; --heart-y:-58px; }
  #love-particles span:nth-child(2) { animation-delay:.18s; --heart-x:54px; --heart-y:-70px; }
  #love-particles span:nth-child(3) { animation-delay:.34s; --heart-x:84px; --heart-y:-20px; }
  #love-particles span:nth-child(4) { animation-delay:.48s; --heart-x:-92px; --heart-y:-18px; }
  .love #love-particles { display:block; }
  @keyframes heartFloat {
    0% { opacity:0; transform:translate(0,16px) scale(.35) rotate(-15deg); }
    20% { opacity:1; }
    100% { opacity:0; transform:translate(var(--heart-x),var(--heart-y)) scale(1) rotate(18deg); }
  }
  #sleep-particles { right:calc(50% - clamp(75px, 18vw, 150px)); top:calc(50% - clamp(80px, 20vw, 165px)); width:80px; height:70px; }
  #sleep-particles span { font:700 clamp(20px, 5vw, 38px)/1 ui-monospace, monospace; animation:zzzFloat 2.4s ease-out infinite; }
  #sleep-particles span:nth-child(1) { right:0; top:35px; }
  #sleep-particles span:nth-child(2) { right:24px; top:12px; animation-delay:.5s; }
  #sleep-particles span:nth-child(3) { right:48px; top:0; animation-delay:1s; }
  .sleepy #sleep-particles { display:block; }
  @keyframes zzzFloat {
    0% { opacity:0; transform:translate(8px,16px) scale(.65); }
    25%,70% { opacity:.8; }
    100% { opacity:0; transform:translate(-12px,-38px) scale(1.1); }
  }
  #dizzy-stars { left:50%; top:50%; width:1px; height:1px; }
  #dizzy-stars span {
    position:absolute; color:#28e3ed; font:700 clamp(14px, 3.2vw, 26px)/1 ui-monospace, monospace;
    filter:drop-shadow(0 0 7px rgba(40,227,237,.8));
    animation:dizzyTwinkle 1.1s ease-in-out infinite;
  }
  #dizzy-stars span:nth-child(1) { left:-130px; top:-110px; }
  #dizzy-stars span:nth-child(2) { left:108px; top:-120px; animation-delay:.2s; }
  #dizzy-stars span:nth-child(3) { left:-156px; top:24px; animation-delay:.42s; }
  #dizzy-stars span:nth-child(4) { left:142px; top:36px; animation-delay:.64s; }
  #dizzy-stars span:nth-child(5) { left:-30px; top:-146px; animation-delay:.88s; }
  .dizzy #dizzy-stars { display:block; }
  .eye {
    position:relative;
    width:clamp(92px, 23vw, 200px);
    height:clamp(82px, 20vw, 175px);
    border-radius:30% 34% 28% 32%;
    background:radial-gradient(circle at 42% 32%, #f3ffff 0 5%, transparent 6%), linear-gradient(155deg, #bfffff 0%, #49dce8 28%, #12b6cd 65%, #056f88 100%);
    box-shadow:
      0 0 12px rgba(73,239,249,.95),
      0 0 32px rgba(27,218,255,.45),
      inset 0 -8px 15px rgba(0,77,95,.4),
      inset 0 2px 0 rgba(255,255,255,.42);
    overflow:hidden;
    transform-origin:center;
    transform:translate(var(--look-x, 0px), var(--look-y, 0px));
  }
  .eye::after {
    content:""; position:absolute; inset:-5%;
    background:linear-gradient(145deg, rgba(255,255,255,.22), transparent 42%, rgba(0,42,54,.2));
    pointer-events:none;
  }
  .pupil {
    position:absolute; z-index:2; left:50%; top:53%; width:48%; aspect-ratio:1;
    transform:translate(-50%, -50%) translate(var(--look-x, 0px), var(--look-y, 0px));
    border:clamp(3px, .7vw, 7px) solid rgba(185,255,255,.68); border-radius:47% 53% 51% 49%;
    background:radial-gradient(circle at 34% 28%, #fff 0 8%, #b9ffff 9% 13%, transparent 14%), radial-gradient(circle at 54% 57%, #053847 0 30%, #011e28 31% 52%, #075b70 53% 100%);
    box-shadow:0 0 11px rgba(202,255,255,.9), inset 0 0 8px rgba(0,0,0,.75);
    transition:transform .18s ease;
  }
  .pupil::after {
    content:""; position:absolute; right:14%; bottom:16%; width:15%; aspect-ratio:1;
    border-radius:50%; background:rgba(220,255,255,.72);
  }
  .tear {
    display:none;
    position:absolute;
    left:-14%;
    top:58%;
    width:clamp(9px, 2vw, 16px);
    height:clamp(15px, 3vw, 27px);
    background:#28e3ed;
    border-radius:60% 40% 60% 60%;
    filter:drop-shadow(0 0 7px rgba(40,227,237,.85));
    z-index:3;
    pointer-events:none;
    --tear-drift:-8px;
    --tear-delay:0s;
    --tear-start:58%;
    top:var(--tear-start);
  }
  #left .tear.t2 { --tear-delay:.22s; --tear-start:46%; left:-18%; }
  #left .tear.t3 { --tear-delay:.44s; --tear-start:68%; left:-12%; }
  #right .tear { left:auto; right:-14%; --tear-drift:8px; }
  #right .tear.t2 { --tear-delay:.3s; --tear-start:47%; right:-18%; }
  #right .tear.t3 { --tear-delay:.52s; --tear-start:67%; right:-12%; }
  .crying .tear {
    display:block;
    animation:tearDrop 1.15s ease-in infinite;
    animation-delay:var(--tear-delay);
  }
  .lid {
    position:absolute; left:-8%; width:116%; height:55%;
    background:#000; z-index:4; transition:transform .16s ease;
  }
  .surprised .lid,
  .curious .lid,
  .happy .lid,
  .sad .lid,
  .crying .lid,
  .angry .lid,
  .love .lid,
  .hot .lid,
  .cold .lid,
  .thinking .lid,
  .scared .lid,
  .proud .lid,
  .excited .lid,
  .confused .lid,
  .alert .lid,
  .dizzy .lid,
  .searching .lid,
  .powered .lid,
  .distracted .lid,
  .dancing .lid,
  .round .lid,
  .blob .lid {
    display:none;
    animation:none;
    transform:none;
  }
  .lid.top { top:-56%; border-radius:0 0 55% 55%; }
  .lid.bottom { bottom:-56%; border-radius:55% 55% 0 0; }

  .blink .lid.top { transform:translateY(82%); }
  .blink .lid.bottom { transform:translateY(-82%); }
  .sleepy .eye {
    height:clamp(24px, 6vw, 50px);
    margin-top:clamp(38px, 9vw, 78px);
    border-radius:50% 50% 42% 42%;
    animation:sleepySway 2.8s ease-in-out infinite;
  }
  .sleepy .lid { display:none; }
  .sleepy .eye::before,
  .sleepy .eye::after { display:none; }
  .sleepy .pupil {
    top:32%; width:38%; opacity:.72;
    transform:translate(-50%, -50%) translate(var(--look-x, 0px), var(--look-y, 0px)) scaleY(.55);
  }
  .surprised .eye { animation:surprisedEyes .5s ease both; }
  .surprised .lid.top { transform:translateY(-12%) rotate(-4deg); }
  .curious .eye:first-child { animation:curiousLeft .7s ease both; }
  .curious .eye:last-child { animation:curiousRight .7s ease both; }
  .curious .lid.top { transform:translateY(8%) rotate(-5deg); }
  .happy .lid.bottom { transform:translateY(-34%); }
  .happy .eye { animation:happyBounce .8s ease both; }
  .sad .lid.top { transform:translateY(28%) rotate(7deg); }
  .sad .lid.bottom { transform:translateY(-8%); }
  .sad .eye { animation:sadDroop 1.2s ease both; filter:saturate(.72) brightness(.78); }
  .crying .eye { animation:cryingTremble .7s ease-in-out infinite alternate; filter:saturate(.7) brightness(.88); overflow:visible; }
  .crying .lid.top { transform:translateY(24%) rotate(7deg); }
  .crying .lid.bottom { transform:translateY(-8%); }
  .angry .lid.top { transform:translateY(16%) rotate(12deg); }
  .angry .eye:first-child { animation:angryLeft .45s ease both; }
  .angry .eye:last-child { animation:angryRight .45s ease both; }
  .love .eye { animation:lovePulse 1s ease-in-out 2 alternate; filter:saturate(1.35) brightness(1.15); }
  .excited .eye { animation:excitedEyes .34s ease-in-out 3 alternate; }
  .excited .lid.bottom { transform:translateY(-18%); }
  .confused #left { animation:confusedAlternateLeft 2.2s ease-in-out infinite; transform:rotate(-6deg); }
  .confused #right { animation:confusedAlternateRight 2.2s ease-in-out infinite; transform:rotate(6deg); }
  .confused #left, .confused #right {
    transform-origin:center center;
    clip-path:inset(0 0 0 0 round 30% 34% 28% 32%);
  }
  .confused .lid.top { transform:translateY(18%) rotate(7deg); }
  .alert .eye { animation:alertEyes .32s ease-in-out 2 alternate; }
  .dizzy .eye { animation:dizzyEyes .42s ease-in-out infinite alternate; }
  .dizzy .lid { animation:lidWobble .42s ease-in-out infinite alternate; }
  .dizzy .eye::before {
    content:"";
    position:absolute;
    inset:16% 12% 16%;
    background:center/contain no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M66 50 C66 41 59 34 50 34 C40 34 32 42 32 52 C32 64 42 74 54 74 C68 74 78 63 78 50 C78 34 65 22 49 22 C31 22 18 36 18 54' fill='none' stroke='%2328e3ed' stroke-width='9' stroke-linecap='round'/></svg>");
    filter:drop-shadow(0 0 8px rgba(40,227,237,.85));
    animation:spiralSpin .95s linear infinite;
    z-index:3;
    pointer-events:none;
  }
  .searching .eye { animation:searchEyes 1.1s ease-in-out infinite alternate; }
  .searching .eye:first-child { animation-delay:-.25s; }
  .powered .eye { animation:powerEyes .8s cubic-bezier(.2,.8,.2,1) both; }
  .distracted .eye:first-child { animation:lookAsideLeft .7s ease both; }
  .distracted .eye:last-child { animation:lookAsideRight .7s ease both; }
  .distracted .lid.top { transform:translateY(20%); }
  .round .eye { animation:roundMorph 1.1s ease both; }
  .blob .eye { animation:blobMorph 1s cubic-bezier(.2,.8,.2,1) both; }

  .happy .eye, .sad .eye, .angry .eye, .love .eye {
    animation-name:emotionPanelToGlyph;
    animation-duration:.55s;
    animation-timing-function:ease;
    animation-fill-mode:both;
  }
  .happy .eye::before, .sad .eye::before, .crying .eye::before,
  .love .eye::before { animation:glyphReveal .55s ease both; }

  .happy .eye::before, .sad .eye::before, .crying .eye::before {

  .love .eye::before {
    content:"♥"; position:absolute; inset:0; display:grid; place-items:center;

  @keyframes surprisedEyes {

  @keyframes sleepyTopSequence {

  #status {

  @media (prefers-reduced-motion:reduce) {

  }
</style>

<body>
<div id="stage">
  <div id="stars"></div>
  <button id="settings-toggle" type="button">SETTINGS</button>
  <div id="setup-overlay" aria-hidden="true">
    <form id="setup-card">

      <p>Set your companion's style and routine. You can change this anytime.</p>
      <div class="setup-row"><label for="setup-color">Color theme</label><select id="setup-color"><option value="cyan">Cyan</option><option value="mint">Mint</option><option value="pink">Pink</option><option value="gold">Gold</option><option value="violet">Violet</option></select></div>
      <div class="setup-row"><label for="setup-bed">Bed time</label><input id="setup-bed" type="time" value="20:30"></div>

      <div id="setup-permissions" aria-live="polite">MIC: UNKNOWN | CAMERA: UNKNOWN | MOTION: UNKNOWN</div>
      <button id="setup-save" type="submit">SAVE AND START</button>
    </form>
  </div>

    <button data-emotion="cold">COLD</button>
    <button data-emotion="thinking">THINKING</button>
    <button data-emotion="scared">SCARED</button>
    <button data-emotion="proud">PROUD</button>
    <button data-emotion="excited">EXCITED</button>
    <button data-emotion="confused">CONFUSED</button>
    <button data-emotion="curious">CURIOUS</button>
    <button data-emotion="sleepy">SLEEPY</button>
    <button data-emotion="dizzy">DIZZY</button>
    <button data-emotion="alert">ALERT</button>

  </div>
  <div id="face">
    <div class="eye" id="left"><span class="pupil"></span><div class="lid top"></div><div class="lid bottom"></div><span class="tear t1"></span><span class="tear t2"></span><span class="tear t3"></span></div>
    <div class="eye" id="right"><span class="pupil"></span><div class="lid top"></div><div class="lid bottom"></div><span class="tear t1"></span><span class="tear t2"></span><span class="tear t3"></span></div>

  </div>

</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const face = document.getElementById('face');
  const eyes = [...document.querySelectorAll('.eye')];
  const status = document.getElementById('status');
  const enable = document.getElementById('enable');
  const settingsToggle = document.getElementById('settings-toggle');
  const setupOverlay = document.getElementById('setup-overlay');
  const setupCard = document.getElementById('setup-card');
  const setupColor = document.getElementById('setup-color');
  const setupBed = document.getElementById('setup-bed');
  const setupWake = document.getElementById('setup-wake');
  const setupVoice = document.getElementById('setup-voice');
  const setupCalm = document.getElementById('setup-calm');
  const setupPermissions = document.getElementById('setup-permissions');
  let audioCtx = null, lastSound = 0, lastShake = 0, lastOrientationSound = 0;
  let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
  let lastMove = performance.now(), sleeping = false;
  let lastAccel = {x:0,y:0,z:0};
  let pointerStart = null, holdTimer = null;
  let microphoneStream = null, analyser = null, cameraStream = null, cameraTimer = null;
  let lastLoudSound = 0, lastFaceAt = 0, lastDanceBeat = 0;
  let currentState = localStorage.getItem('robot-eyes-state') || 'idle';
  let stateTimer = null, stateVersion = 0;
  const EMOTION_PREVIEW_MS = 3000;
  const MANUAL_EMOTION_HOLD_MS = 10000;
  const SETTINGS_KEY = 'robot-eyes-settings-v1';
  const QUIET_CHECK_INTERVAL_MS = 30000;
  let manualEmotionUntil = 0;
  let quietMode = false;
  let micPermissionState = 'unknown';
  let cameraPermissionState = 'unknown';
  let motionPermissionState = 'unknown';

  const defaultSettings = {
    color: 'cyan',
    bedTime: '20:30',
    wakeTime: '07:00',
    voiceAccess: false,
    calmMode: false
  };
  let appSettings = { ...defaultSettings };

  const themeHueMap = {
    cyan: '0deg',
    mint: '-35deg',
    pink: '120deg',
    gold: '175deg',
    violet: '78deg'
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return null;
      return { ...defaultSettings, ...JSON.parse(raw) };
    } catch (error) {
      return null;
    }
  }

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(appSettings));
  }

  function applyTheme() {
    const hue = themeHueMap[appSettings.color] || '0deg';
    document.body.style.setProperty('--theme-hue', hue);
  }

  function minutesFromTime(text) {
    const [h, m] = text.split(':').map(Number);
    return h * 60 + m;
  }

  function isInQuietWindow(now = new Date()) {
    const current = now.getHours() * 60 + now.getMinutes();
    const bed = minutesFromTime(appSettings.bedTime);
    const wake = minutesFromTime(appSettings.wakeTime);
    if (bed === wake) return false;
    if (bed < wake) return current >= bed && current < wake;
    return current >= bed || current < wake;
  }

  function isNearBedtime(now = new Date()) {
    const current = now.getHours() * 60 + now.getMinutes();
    const bed = minutesFromTime(appSettings.bedTime);
    const distance = (bed - current + 1440) % 1440;
    return distance > 0 && distance <= 45;
  }

  function openSetup() {
    setupColor.value = appSettings.color;
    setupBed.value = appSettings.bedTime;
    setupWake.value = appSettings.wakeTime;
    setupVoice.checked = !!appSettings.voiceAccess;
    setupCalm.checked = !!appSettings.calmMode;
    renderPermissionSummary();
    setupOverlay.classList.add('show');
    setupOverlay.setAttribute('aria-hidden', 'false');
  }

  function renderPermissionSummary() {
    setupPermissions.textContent = `MIC: ${micPermissionState.toUpperCase()} | CAMERA: ${cameraPermissionState.toUpperCase()} | MOTION: ${motionPermissionState.toUpperCase()}`;
  }

  function closeSetup() {
    setupOverlay.classList.remove('show');
    setupOverlay.setAttribute('aria-hidden', 'true');
  }

  function syncRoutineState(force = false) {
    quietMode = isInQuietWindow();
    document.body.classList.toggle('quiet', quietMode);
    if (quietMode) {
      sleeping = true;
      if (!face.classList.contains('sleepy')) setState('sleepy', 0, { force:true });
      status.textContent = 'QUIET MODE';
      return;
    }
    if (isNearBedtime()) {
      sleeping = true;
      if (!face.classList.contains('sleepy')) setState('sleepy', 0, { force:true });
      status.textContent = 'WINDING DOWN';
      return;
    }
    sleeping = false;
    if (face.classList.contains('sleepy')) {
      face.classList.remove('sleepy');
      currentState = 'idle';
      localStorage.setItem('robot-eyes-state', currentState);
    }
    if (status.textContent === 'QUIET MODE' || status.textContent === 'WINDING DOWN') {
      status.textContent = 'IDLE';
    }
  }

  function setState(name, ms=700, opts={}) {
    const now = Date.now();
    if (manualEmotionUntil > now && !opts.force && !opts.lock) return;
    if (opts.lock) manualEmotionUntil = now + MANUAL_EMOTION_HOLD_MS;
    stateVersion += 1;
    const version = stateVersion;
    if (stateTimer) {
      clearTimeout(stateTimer);
      stateTimer = null;
    }
    face.classList.remove('blink','sleepy','surprised','curious','happy','sad','crying','angry','love','hot','cold','thinking','scared','proud','excited','confused','alert','dizzy','searching','powered','distracted','round','blob','dancing');
    if (name) face.classList.add(name);
    currentState=name || 'idle';
    localStorage.setItem('robot-eyes-state', currentState);
    status.textContent = name ? name.toUpperCase() : 'IDLE';
    if (ms) stateTimer = setTimeout(() => {
      if (version !== stateVersion) return;
      if (face.classList.contains(name)) {
        face.classList.remove(name);
        currentState='idle';
        localStorage.setItem('robot-eyes-state', currentState);
        status.textContent = sleeping ? 'SLEEP' : 'IDLE';
      }
    }, ms);
  }

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq=440, duration=.08, type='sine', volume=.035, slide=0) {
    try {
      initAudio();
      const now = audioCtx.currentTime;
      const loudness = appSettings.calmMode ? 0.6 : 1;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), now+duration);
      g.gain.setValueAtTime(.0001, now);
      g.gain.exponentialRampToValueAtTime(volume * loudness, now+.008);
      g.gain.exponentialRampToValueAtTime(.0001, now+duration);
      o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+duration+.02);
    } catch(e) {}
  }
  function boop(kind='curious') {
    if (quietMode) return;
    const t = performance.now();
    if (t-lastSound < 70) return;
    lastSound=t;
    if(kind==='tap') { tone(620,.07,'triangle',.045,140); setTimeout(()=>tone(880,.09,'sine',.03,-180),45); }
    else if(kind==='happy') { tone(520,.06,'sine',.03,180); setTimeout(()=>tone(760,.08,'triangle',.028,240),70); }
    else if(kind==='sad') { tone(300,.2,'sine',.018,-90); setTimeout(()=>tone(220,.24,'sine',.014,-50),150); }
    else if(kind==='crying') { tone(260,.24,'sine',.018,-110); setTimeout(()=>tone(190,.3,'sine',.014,-70),170); }
    else if(kind==='love') { tone(560,.08,'sine',.025,120); setTimeout(()=>tone(840,.12,'triangle',.022,140),90); }
    else if(kind==='angry') { tone(150,.12,'sawtooth',.025,90); setTimeout(()=>tone(110,.12,'square',.022,-30),100); }
    else if(kind==='hot') { tone(260,.18,'sawtooth',.018,180); setTimeout(()=>tone(380,.12,'sine',.015,120),130); }
    else if(kind==='cold') { tone(880,.1,'sine',.018,-220); setTimeout(()=>tone(620,.16,'triangle',.014,-140),100); }
    else if(kind==='thinking') { tone(360,.12,'sine',.016,80); setTimeout(()=>tone(500,.1,'triangle',.014,80),150); }
    else if(kind==='scared') { tone(980,.06,'square',.025,-380); setTimeout(()=>tone(720,.12,'square',.018,-200),80); }
    else if(kind==='proud') { tone(420,.08,'triangle',.022,140); setTimeout(()=>tone(620,.12,'sine',.02,180),100); }
    else if(kind==='excited') { tone(700,.06,'square',.03,260); setTimeout(()=>tone(1040,.07,'square',.025,-80),75); }
    else if(kind==='search') { tone(280,.12,'sine',.02,140); setTimeout(()=>tone(190,.14,'sine',.018,100),120); }
    else if(kind==='power') { tone(180,.16,'sine',.02,260); setTimeout(()=>tone(420,.14,'triangle',.025,260),130); setTimeout(()=>tone(760,.12,'sine',.025,180),250); }
    else if(kind==='hold') { tone(260,.3,'sine',.018,360); }
    else if(kind==='servo') { tone(140,.1,'square',.012,220); }
    else if(kind==='shake') {
      tone(180,.12,'square',.035,260);
      setTimeout(()=>tone(420,.08,'square',.03,-120),80);
      setTimeout(()=>tone(130,.18,'sawtooth',.018,-60),160);
    } else if(kind==='alert') { tone(980,.07,'square',.025,-250); }
    else { tone(420,.06,'sine',.025,180); }
  }

  function lookAt(nx, ny) {
    targetX = Math.max(-38, Math.min(38, nx*42));
    targetY = Math.max(-52, Math.min(52, ny*58));
    lastMove = performance.now(); sleeping=false;
  }
  function animate() {
    currentX += (targetX-currentX)*.12; currentY += (targetY-currentY)*.12;
    eyes.forEach((eye,index) => {
      eye.style.setProperty('--look-x', `${currentX+(index===0?-2:2)}px`);
      eye.style.setProperty('--look-y', `${currentY}px`);
    });
    requestAnimationFrame(animate);
  }
  animate();

  function blink() {
    if (sleeping || quietMode) return;
    setState('blink',180);
    if (Math.random()>.25) boop('idle');
  }
  function idle() {
    syncRoutineState();
    if (quietMode) return;
    if (isNearBedtime()) return;
    sleeping = false;
    if (!sleeping) {
      lookAt((Math.random()*2-1)*.55,(Math.random()*2-1)*.35);
      if (Math.random() < .35) {
        const mood=Math.random();
        if (mood < .14) { setState('round',1100); }
        else if (mood < .27) { setState('blob',1000); boop('happy'); }
        else if (mood < .38) { setState('sad',1200); boop('sad'); }
        else if (mood < .41) { setState('crying',1400); boop('crying'); }
        else if (mood < .55) { setState('curious',850); boop(); }
        else if (mood < .68) { setState('happy',850); boop('happy'); }
        else if (mood < .79) { setState('love',1200); boop('love'); }
        else if (mood < .86) { setState('angry',850); boop('angry'); }
        else if (mood < .9) { setState('hot',1100); boop('hot'); }
        else if (mood < .94) { setState('cold',1100); boop('cold'); }
        else if (mood < .97) { setState('thinking',1100); boop('thinking'); }
        else if (mood < .985) { setState('scared',900); boop('scared'); }
        else { setState('proud',1000); boop('proud'); }
      }
    }
  }
  setInterval(() => { if(Math.random()<.55) blink(); }, 3500);
  setInterval(idle, 5000);

  stage.addEventListener('pointerdown', e => {
    initAudio(); lastMove=performance.now(); sleeping=false;
    face.classList.remove('sleepy');
    pointerStart={x:e.clientX,y:e.clientY,time:performance.now()};
    clearTimeout(holdTimer);
    holdTimer=setTimeout(() => { setState('curious',0); boop('hold'); },420);
    const r=stage.getBoundingClientRect();
    lookAt((e.clientX-r.left-r.width/2)/(r.width/2), (e.clientY-r.top-r.height/2)/(r.height/2));
    if (quietMode) return;
    setState('surprised',260); boop('tap');
    if (navigator.vibrate) navigator.vibrate(18);
  });
  stage.addEventListener('pointermove', e => {
    if (e.buttons) {
      const r=stage.getBoundingClientRect();
      lookAt((e.clientX-r.left-r.width/2)/(r.width/2), (e.clientY-r.top-r.height/2)/(r.height/2));
    }
  });
  stage.addEventListener('pointerup', e => {
    clearTimeout(holdTimer);
    if (!pointerStart) return;
    const dx=e.clientX-pointerStart.x, dy=e.clientY-pointerStart.y;
    if (Math.hypot(dx,dy)>55 && Math.abs(dx)>Math.abs(dy)) {
      if (quietMode) { pointerStart=null; return; }
      const direction=dx<0?'left':'right';
      face.classList.remove('swipe-left','swipe-right');
      void face.offsetWidth;
      face.classList.add(`swipe-${direction}`);
      lookAt(dx<0?-1:1,0);
      setState('excited',650); boop('excited');
    } else if (performance.now()-pointerStart.time>420) {
      setState('curious',700);
    }
    pointerStart=null;
  });
  stage.addEventListener('pointercancel', () => { clearTimeout(holdTimer); pointerStart=null; });

  document.getElementById('emotion-controls').addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('emotion-controls').addEventListener('click', e => {
    const button=e.target.closest('[data-emotion]');
    if (!button) return;
    if (quietMode) {
      setState('sleepy', 0, { force:true });
      status.textContent='QUIET MODE';
      return;
    }
    const emotion=button.dataset.emotion;
    sleeping=false; lastMove=performance.now();
    setState(emotion, MANUAL_EMOTION_HOLD_MS, { lock:true, force:true });
    if (emotion==='dizzy') {
      face.classList.add('shake');
      setTimeout(() => face.classList.remove('shake'),450);
    }
    const sound = ['happy','love','sad','crying','angry','hot','cold','thinking','scared','proud','excited'].includes(emotion) ? emotion : 'curious';
    boop(sound);
  });

  function motion(e) {
    if (quietMode) return;
    const a=e.accelerationIncludingGravity || e.acceleration;
    if(!a) return;
    const x=a.x||0,y=a.y||0,z=a.z||0;
    const delta=Math.abs(x-lastAccel.x)+Math.abs(y-lastAccel.y)+Math.abs(z-lastAccel.z);
    lastAccel={x,y,z};
    if (delta>10 && delta<=22 && performance.now()-lastShake>500) {
      lastMove=performance.now();
      setState('alert',500);
    }
    if(delta>22 && performance.now()-lastShake>800) {
      lastShake=performance.now(); lastMove=performance.now();
      face.classList.remove('surprised');
      setState('dizzy',1200); face.classList.add('shake'); setTimeout(()=>face.classList.remove('shake'),450);
      if (navigator.vibrate) navigator.vibrate([35,35,55]);
      boop('shake');
    }
  }
  window.addEventListener('devicemotion', motion);

  function orientation(e) {
    const gx=Math.max(-1,Math.min(1,(e.gamma||0)/45));
    const gy=Math.max(-1,Math.min(1,(e.beta||0)/45));
    lookAt(gx,gy);
    face.style.transform=`rotate(${Math.max(-8,Math.min(8,(e.gamma||0)/7))}deg)`;
    if (!quietMode && Math.abs(e.gamma||0)>8 && performance.now()-lastOrientationSound>900) {
      lastOrientationSound=performance.now(); boop('servo');
    }
  }
  window.addEventListener('deviceorientation', orientation);

  async function startMicrophone() {
    if (!appSettings.voiceAccess || microphoneStream || !navigator.mediaDevices?.getUserMedia) return;
    try {
      initAudio();
      microphoneStream=await navigator.mediaDevices.getUserMedia({audio:true});
      micPermissionState = 'granted';
      renderPermissionSummary();
      const source=audioCtx.createMediaStreamSource(microphoneStream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=512; source.connect(analyser);
      const data=new Uint8Array(analyser.fftSize);
      const freqData=new Uint8Array(analyser.frequencyBinCount);
      const listen=() => {
        if (!analyser) return;
        analyser.getByteTimeDomainData(data);
        analyser.getByteFrequencyData(freqData);
        let total=0;
        data.forEach(value => { const sample=(value-128)/128; total+=sample*sample; });
        const volume=Math.sqrt(total/data.length);
        let bass=0, mids=0;
        for (let i=2; i<20; i++) bass += freqData[i];
        for (let i=20; i<80; i++) mids += freqData[i];
        const beat=Math.max(0, mids - bass * 0.7);
        if (!quietMode && volume>.1 && beat>1700 && performance.now()-lastDanceBeat>1800) {
          lastDanceBeat=performance.now();
          setState('dancing',1300);
          boop('happy');
        }
        if (!quietMode && volume>.18 && performance.now()-lastLoudSound>1300) {
          lastLoudSound=performance.now(); setState('alert',700); boop('alert');
        }
        requestAnimationFrame(listen);
      };
      listen();
    } catch (error) {
      micPermissionState = 'denied';
      renderPermissionSummary();
    }
  }

  function stopMicrophone() {
    if (microphoneStream) microphoneStream.getTracks().forEach(track => track.stop());
    microphoneStream=null;
    analyser=null;
  }

  async function startCamera() {
    if (cameraStream || !navigator.mediaDevices?.getUserMedia || !('FaceDetector' in window)) return;
    try {
      cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      cameraPermissionState = 'granted';
      renderPermissionSummary();
      const video=document.createElement('video');
      video.srcObject=cameraStream; video.muted=true; video.playsInline=true;
      await video.play();
      const detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});
      cameraTimer=setInterval(async () => {
        try {
          const faces=await detector.detect(video);
          if (faces.length) {
            const box=faces[0].boundingBox;
            const nx=(box.x+box.width/2)/video.videoWidth*2-1;
            const ny=(box.y+box.height/2)/video.videoHeight*2-1;
            lastFaceAt=performance.now(); lookAt(-nx,ny);
            if (box.width/video.videoWidth>.24) { setState('excited',650); boop('excited'); }
            else if (currentState!=='curious') { setState('curious',650); boop(); }
          } else if (lastFaceAt && performance.now()-lastFaceAt>2200 && currentState!=='searching') {
            setState('searching',0); boop('search');
          }
        } catch (error) {}
      },900);
    } catch (error) {
      cameraPermissionState = 'denied';
      renderPermissionSummary();
    }
  }

  async function startOptionalSensors() {
    const starts=[startCamera()];
    if (appSettings.voiceAccess) starts.push(startMicrophone());
    await Promise.allSettled(starts);
    if (navigator.getBattery) {
      try {
        const battery=await navigator.getBattery();
        const batteryReaction=() => {
          if (battery.charging) { setState('powered',850); boop('power'); }
          else if (battery.level<.2) { setState('sleepy',0); tone(180,.25,'sine',.012,-70); }
        };
        battery.addEventListener('chargingchange',batteryReaction);
        battery.addEventListener('levelchange',batteryReaction);
        batteryReaction();
      } catch (error) {}
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    syncRoutineState();
    lastMove=performance.now(); sleeping=false;
    if (!quietMode) { setState('distracted',650); boop('alert'); }
  });

  async function enableMotion() {
    initAudio();
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission==='function') {
        const r=await DeviceMotionEvent.requestPermission();
        if(r!=='granted') throw new Error('motion denied');
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission==='function') {
        const r=await DeviceOrientationEvent.requestPermission();
        if(r!=='granted') throw new Error('orientation denied');
      }
      motionPermissionState = 'granted';
      renderPermissionSummary();
      startOptionalSensors();
      enable.classList.remove('show');
      status.textContent='ONLINE';
      setTimeout(()=>status.textContent='IDLE',1000);
      boop('tap');
    } catch(e) {
      motionPermissionState = 'denied';
      renderPermissionSummary();
      status.textContent='TOUCH STILL WORKS';
      enable.textContent='MOTION PERMISSION DENIED';
      setTimeout(()=>enable.classList.remove('show'),1800);
    }
  }
  enable.addEventListener('click', enableMotion);

  settingsToggle.addEventListener('click', () => openSetup());
  setupOverlay.addEventListener('click', e => {
    if (e.target === setupOverlay && localStorage.getItem(SETTINGS_KEY)) closeSetup();
  });
  setupCard.addEventListener('submit', e => {
    e.preventDefault();
    appSettings = {
      color: setupColor.value,
      bedTime: setupBed.value || defaultSettings.bedTime,
      wakeTime: setupWake.value || defaultSettings.wakeTime,
      voiceAccess: setupVoice.checked,
      calmMode: setupCalm.checked
    };
    saveSettings();
    applyTheme();
    syncRoutineState(true);
    if (appSettings.voiceAccess) startMicrophone();
    else stopMicrophone();
    closeSetup();
  });

  // iOS/Safari commonly requires a user gesture before motion sensors work.
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission==='function') {
    enable.classList.add('show');
    motionPermissionState = 'prompt';
  } else {
    motionPermissionState = 'auto';
  }
  if ('FaceDetector' in window) cameraPermissionState = 'prompt';
  else cameraPermissionState = 'unsupported';
  micPermissionState = appSettings.voiceAccess ? 'prompt' : 'disabled';
  renderPermissionSummary();
  const savedSettings = loadSettings();
  if (savedSettings) {
    appSettings = savedSettings;
    micPermissionState = appSettings.voiceAccess ? 'prompt' : 'disabled';
    applyTheme();
    syncRoutineState(true);
  } else {
    openSetup();
  }
  setInterval(() => syncRoutineState(), QUIET_CHECK_INTERVAL_MS);
  window.addEventListener('load', () => {
    setTimeout(()=>{ tone(220,.12,'sine',.018,180); setTimeout(()=>tone(500,.09,'triangle',.018,150),110); },350);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
})();
</script>
</body>
</html>
